server:
  port: 9000
spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: org.n52.edis.pegelonline
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties.spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: org.n52.edis.pegelonlinekafkaconsumer.model
      properties.spring.json.value.default.type: org.n52.edis.pegelonlinekafkaconsumer.model.PegelonlineKafkaMessage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      # Parallelize consumption across the topic's partitions (capped at the partition count).
      concurrency: 3
edis:
  kafka:
    consumer:
      topic: de.itzbund.pegelonline
      group: de.itzbund.edis
      id: consumer01
  mqtt:
    enabled: true
    server-uris:
      - ssl://localhost:8883
    client-id-prefix: edis.pegelonline.kafka-consumer
    client-id: consumer01
    base-topic: edis/pegelonline
    file-persistence-enabled: false
    file-persistence-directory: /var/temp
    initial-connect-retry-attempts: 60
    initial-connect-retry-delay: 60000 # in milliseconds
    initial-maxAttempts: 20
    initial-maxDelay: 100
    reconnect: true
    clean-session: false
    connection-timeout: 60
    keep-alive-interval: 60
    message-delivery-monitor: logging
    qos: 0
    worker-threads: 4
    queue-capacity: 1000
    # Must be >= worker threads + Kafka listener concurrency (each listener thread may also
    # publish inline via CallerRuns) or Paho throws REASON_CODE_MAX_INFLIGHT (32202) once
    # several callers publish concurrently, even at QoS 0.
    max-inflight: 20
    basic-authentication: true
    username: rabbitmq
    password: rabbitmq
    tls:
      tls-enabled: true
      peer-verification-enabled: true
      ca-cert-file: "C:/Users/Sebastian/Entwicklung/Projekte/edis/pegelonline-kafka-consumer/docker/certs/ca_certificate.pem"
      client-cert-file: "C:/Users/Sebastian/Entwicklung/Projekte/edis/pegelonline-kafka-consumer/docker/certs/client_certificate.pem"
      key-file: "C:/Users/Sebastian/Entwicklung/Projekte/edis/pegelonline-kafka-consumer/docker/certs/client_key.pem"
      password: "bunnies"
logging:
  level:
    ssl: debug
    org.n52.edis: debug
management:
  health.rabbit.enabled: false
  endpoints.web.exposure.include: "info,health,metrics"
  endpoint:
    health.show-components: always
